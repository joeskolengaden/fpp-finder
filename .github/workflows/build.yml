name: Build FPP Finder

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac zip dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win zip nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: fpp-finder-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
